<div id="crm-confirm-modal" class="crm-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="crm-confirm-modal-title" aria-hidden="true">
  <div class="crm-modal-dialog">
    <div id="crm-confirm-modal-title" class="crm-modal-title">Confirm action</div>
    <div id="crm-confirm-modal-message" class="crm-modal-body">Are you sure you want to proceed with this action?</div>
    <div class="crm-modal-actions">
      <button type="button" class="btn btn-outline-secondary btn-sm" data-action="cancel-confirm-modal">
        Cancel
      </button>
      <button type="button" id="crm-confirm-modal-accept" class="btn btn-primary btn-sm">
        Confirm
      </button>
    </div>
  </div>
</div>
